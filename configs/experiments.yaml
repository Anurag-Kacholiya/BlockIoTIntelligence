# Experiment defaults (ADR §11, §19).
repetitions: 3
seeds: [42, 43, 44]
sample_rows: 200000          # rows streamed through the architecture per run (full DNN view: 2,219,201)
scaling_devices: [10, 25, 50, 100, 250, 500, 1000]
blockchain: [false, true]

# Experiment suite for the first project presentation (scripts/run_experiments.py --suite presentation1).
suites:
  presentation1:
    # A/B/C: accuracy, latency, resources — same data, seeds and models, only the ledger differs.
    comparison:
      modes: [baseline, per_event, batch]
      seeds: [42, 43, 44]
      # Per-event mode mines one block per transaction and a local Anvil node slows as blocks accumulate
      # (104 -> 63 events/s from 1k to 5k events), so run sizes are kept equal and moderate for every mode.
      rows: 10000
      devices: 10
      edges: 2
      fogs: 1
    # E: scalability in number of logical devices (paper's device/edge node scaling).
    scaling:
      modes: [baseline, batch, per_event]
      devices: [10, 50, 100, 250, 500]
      rows: 5000
      seed: 42
      edges: 2
      fogs: 1

  # Final task 1, step 8: the same comparison and scaling on dataset v2's realistic replay (real devices and timing,
  # models trained on the time split). The replayed messages are the same test-window slices in every run; a seed
  # changes only event ids and device keys.
  final_task1:
    view: real_time
    replay: realistic
    comparison:
      modes: [baseline, per_event, batch]
      seeds: [42, 43, 44]
      rows: 10000
      edges: 2
      fogs: 1
    # E: each of the 10 real devices split round-robin over k devices of its type -> 10, 50, 100, 250, 500 devices,
    # the same 5,000 messages and timing (as the mid-term: more devices, same traffic).
    scaling:
      modes: [baseline, batch, per_event]
      replicas: [1, 5, 10, 25, 50]
      rows: 5000
      seed: 42
      edges: 2
      fogs: 1

  # Final task 2: the same dataset v2 workload on a single node and on a 4-validator QBFT network
  # (scripts/run_multinode.py). The client is identical in every group: transactions signed locally, fog alert and
  # cloud inference records confirmed in the background unless a group says otherwise. Chains:
  #   anvil/null = one node mining every transaction at once (the mid-term and task 1 setup)
  #   anvil/1    = one node, one block per second (block time without consensus)
  #   qbft/1     = 4 Besu validators, QBFT consensus, one block per second
  final_task2:
    view: real_time
    replay: realistic
    signing: local
    audit_writes: background
    rows: 10000
    edges: 2
    fogs: 1
    groups:
      comparison:                # T2.1 what consensus and block time cost
        chains: [[anvil, null], [anvil, 1], [qbft, 1]]
        modes: [per_event, batch]
        seeds: [42, 43, 44]
      await_all:                 # T2.2 the task 1 client (every write awaited) on the QBFT network
        chains: [[qbft, 1]]
        modes: [per_event, batch]
        seeds: [42]
        audit_writes: await
      block_period:              # T2.3 longer block periods (1 s is in comparison)
        chains: [[qbft, 2], [qbft, 5]]
        modes: [batch]
        seeds: [42]
      scaling:                   # T2.4 devices on the QBFT network (each real device split over k), vs final_task1
        chains: [[qbft, 1]]
        modes: [batch, per_event]
        seeds: [42]
        rows: 5000
        replicas: [1, 5, 10, 25, 50]
  final_faults:                # add-on after final task 2: fault tolerance (ADR Experiment F); scripts/run_faults.py
    view: real_time
    replay: realistic
    rows: 10000
    edges: 2
    fogs: 2                    # every layer but the cloud has a peer to take over its traffic
    seed: 42
    chain_backend: qbft        # 4 validators, 1 block/s; nodes: gateway 0, edge-00 1, edge-01 2, fog-00 3, fog-01 0, cloud 1
    block_period_s: 1
    audit_writes: background
    down_at_s: 30              # every fault starts 30 s into the stream ...
    up_at_s: 60                # ... and is repaired 30 s later unless a fault sets its own up_at_s (null: at the end)
    scenarios:
      reference:               # nothing fails: the same loop and records, for comparison
        modes: [batch, per_event]
        faults: []
      device_off:              # a normal sensor with 142 messages in the window that keeps sending afterwards
        modes: [batch]
        faults: [{target: "device:soil_moisture"}]
      edge_down:               # edge-00 and fog-00 carry the attacked device (all attack traffic) and 3 normal sensors
        modes: [batch]
        policies: [recover, none]
        faults: [{target: edge-00}]
      fog_down:
        modes: [batch]
        policies: [recover, none]
        faults: [{target: fog-00}]
      cloud_down:              # the only cloud: recovery holds its input at the fogs (store and forward)
        modes: [batch]
        policies: [recover, none]
        faults: [{target: cloud}]
      node_down:               # validator 1 and the RPC endpoint of edge-00 and the cloud; 3 of 4 keep the quorum
        modes: [batch, per_event]
        faults: [{target: "node:1"}]
      quorum_lost:             # validators 2 and 3: no quorum, the chain halts; node 3 back at 60 s restores it
        modes: [batch, per_event]
        faults: [{target: "node:3"}, {target: "node:2", up_at_s: null}]
  final_task3:                 # final task 3 (RQ-11 AI-driven blockchain): when the gateway closes each device's Merkle
    view: real_time            # batch; scripts/run_ai_blockchain.py. The task 2 scaling workload (T2.4) on its network.
    replay: realistic
    rows: 5000
    replicas: [1, 5, 10, 25, 50]   # 10, 50, 100, 250, 500 devices: the same messages and timing at every point
    edges: 2
    fogs: 1
    batch_size: 256            # messages per round (micro-batch)
    chain_backend: qbft        # 4 validators, 1 block/s
    block_period_s: 1
    signing: local
    audit_writes: background
    simulate:                  # offline sweep: the same scheduler code as a live run, over the whole trade-off
      rows: [5000, 10000]
      hold_rounds: [1, 2, 3]
      break_even: [1, 1.5, 2, 3, 4, 6, 8, 12, 16, 32]
      every: [2, 3, 4]
    # Live runs: shared by rule, forecast and oracle unless a group overrides it. break_even 4 = one root's gas is
    # worth delaying 4 messages by one round; hold_rounds 1 = no message waits more than one extra round.
    policy: {hold_rounds: 1, break_even: 4, protect_suspicious: false}
    groups:
      scaling:                 # T3.1 every policy at every device count (the task 2 scaling runs, T2.4)
        policies: [fixed, rule, forecast, oracle]
        seeds: [42]
      seeds:                   # T3.2 seed spread at 500 devices (a seed changes event ids and device keys only)
        policies: [fixed, rule, forecast]
        replicas: [50]
        seeds: [43, 44]
      settings:                # T3.3 other points of the trade-off at 500 devices
        policies:
          - {policy: interval, every: 2}
          - {policy: rule, break_even: 16}
          - {policy: forecast, break_even: 16}
          - {policy: rule, hold_rounds: 2}
          - {policy: forecast, hold_rounds: 2}
        replicas: [50]
        seeds: [42]
      protect:                 # T3.4 batches with a message the device model flags as an attack are never held
        policies:
          - {policy: rule, protect_suspicious: true}
          - {policy: forecast, protect_suspicious: true}
        replicas: [50]
        seeds: [42]
      single_node:             # T3.5 one Anvil node mining each transaction at once (task 1's chain), same client
        chain: [anvil, null]
        policies: [fixed, forecast]
        seeds: [42]
